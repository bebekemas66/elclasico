<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>El Clasico GM88 Effect Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.16), transparent 28%),
        linear-gradient(135deg, #050814 0%, #111827 42%, #2a0b12 100%);
      color: white;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .card {
      width: min(92vw, 720px);
      padding: 34px 28px;
      border-radius: 28px;
      background: rgba(10, 10, 14, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 216, 107, 0.14);
      border: 1px solid rgba(255, 216, 107, 0.28);
      color: #ffd86b;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.4px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 0.95;
      letter-spacing: 1px;
      color: #ffd86b;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .match {
      margin-top: 16px;
      font-size: clamp(18px, 4vw, 32px);
      font-weight: 900;
    }

    .time {
      margin-top: 12px;
      font-size: clamp(15px, 3vw, 20px);
      font-weight: 700;
      opacity: 0.9;
    }

    .status {
      margin-top: 22px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      line-height: 1.5;
    }

    .ok {
      color: #8cffb0;
      font-weight: 800;
    }

    .warn {
      color: #ffd86b;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="eyebrow">⚽ TEST PAGE ACTIVE</div>

      <h1>EL CLASICO</h1>

      <div class="match">Barcelona VS Real Madrid</div>

      <div class="time">Senin, 11 Mei 2026 • 02.00 WIB</div>

      <div class="status">
        Kalau efek bola turun, banner bawah, dan toast atas muncul, berarti
        <span class="ok">elclasico-effect.js sudah berhasil run</span>.
        <br />
        Kalau belum muncul, cek path file script dan assets di repo.
      </div>
    </section>
  </main>

  <!-- Load script effect dari repo yang sama -->
  <script src="elclasico-effect.js"></script>
</body>
</html>
